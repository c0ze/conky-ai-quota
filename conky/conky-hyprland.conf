-- Hyprland variant of conky.conf: renders as a native Wayland layer-shell
-- background widget (like the desktop widget on Plasma) instead of a tiled
-- XWayland window. Launched via start-conky.sh, which picks this file when
-- XDG_CURRENT_DESKTOP=Hyprland.
conky.config = {
    alignment = 'top_right',
    background = true,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = '#3a3a3a', -- softer than pure black: thinner-looking 1px outline
    default_shade_color = 'black',
    double_buffer = false, -- X11-only
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,  -- 1px glyph outline rendered too heavy; shade is subtler
    draw_shades = true,    -- soft drop shadow for legibility instead
    extra_newline = false,
    font = 'sans-serif:size=12', -- using a modern font if available, fallback is ok
    gap_x = 30,
    gap_y = 60,
    minimum_height = 5,
    minimum_width = 380, -- keeps the AI LIMITS days column clear of the bars
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = true,
    out_to_x = false,

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop', -- layer-shell background layer on Wayland
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,   -- fully transparent background
    own_window_colour = '#1e1e2e', -- only visible if transparency is off

    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

-- AI LIMITS: weekly usage (Grok: billing period, MiMo: monthly plan). texeci fetches in a thread,
-- so a slow provider never freezes the widget; the other calls read the cache.
-- Gray + * means stale; auth!/error means no data; red means a limit >= 95%.
-- Days sit in a fixed-width monospace column so every bar ends flush right.
conky.text = [[
${alignc}${color #cdd6f4}${font sans-serif:weight=Light:size=72}${time %H}${color #89b4fa}:${color #cdd6f4}${time %M}$font$color
${alignc}${color #bac2de}${font sans-serif:size=16}${time %A, %d %B %Y}$font$color
${alignc}${color #f9e2af}${font sans-serif:size=18}${execi 1800 curl --max-time 5 -H "Accept-Language: en" -s "wttr.in/?format=%C+%t"}$font$color
${voffset 10}
${color #89b4fa}${font sans-serif:size=14:bold}SYSTEM$font$color ${hr 2}
${color #cdd6f4}OS:$color $sysname $kernel
${color #cdd6f4}Uptime:$color $uptime
${color #cdd6f4}CPU:$color ${cpu cpu0}% ${alignr}${cpubar 8,180}
${color #cdd6f4}CPU Temp:$color ${hwmon k10temp temp 1}°C ${alignr}${color #cdd6f4}GPU Temp:$color ${hwmon amdgpu temp 1}°C
${color #cdd6f4}RAM:$color $mem/$memmax ${alignr}${membar 8,180}
${color #cdd6f4}Swap:$color $swap/$swapmax ${alignr}${swapbar 8,180}
${color #cdd6f4}GPU VRAM:$color ${execi 2 awk 'NR==1{u=$1} NR==2{t=$1} END{printf "%.1f/%.1fGB", u/1073741824, t/1073741824}' /sys/class/drm/card1/device/mem_info_vram_used /sys/class/drm/card1/device/mem_info_vram_total} ${alignr}${execbar 8,180 awk 'NR==1{u=$1} NR==2{t=$1} END{printf "%.0f", (u/t)*100}' /sys/class/drm/card1/device/mem_info_vram_used /sys/class/drm/card1/device/mem_info_vram_total}

${color #89b4fa}${font sans-serif:size=14:bold}NETWORK$font$color ${hr 2}
${color #cdd6f4}Up:$color ${upspeed} ${alignr}${color #cdd6f4}Down:$color ${downspeed}
${color #cdd6f4}Local IP:$color ${addr enp5s0} (eth) ${addr wlan0} (wifi)

${color #89b4fa}${font sans-serif:size=14:bold}AI LIMITS$font$color ${hr 2}
${color #cdd6f4}Claude:$color${texeci 60 claude-quota fetch}${goto 130}${execpi 60 claude-quota color}${font monospace:size=11}${execi 60 claude-quota days}$font${alignr}${execibar 60 8,180 claude-quota percent}$color
${color #cdd6f4}Codex gand:$color${texeci 60 codex-quota default fetch}${goto 130}${execpi 60 codex-quota default color}${font monospace:size=11}${execi 60 codex-quota default days}$font${alignr}${execibar 60 8,180 codex-quota default percent}$color
${color #cdd6f4}Codex gmail:$color${texeci 60 codex-quota gmail fetch}${goto 130}${execpi 60 codex-quota gmail color}${font monospace:size=11}${execi 60 codex-quota gmail days}$font${alignr}${execibar 60 8,180 codex-quota gmail percent}$color
${color #cdd6f4}Codex personal:$color${texeci 60 codex-quota personal fetch}${goto 130}${execpi 60 codex-quota personal color}${font monospace:size=11}${execi 60 codex-quota personal days}$font${alignr}${execibar 60 8,180 codex-quota personal percent}$color
${color #cdd6f4}Grok:$color${texeci 60 grok-quota fetch}${goto 130}${execpi 60 grok-quota color}${font monospace:size=11}${execi 60 grok-quota days}$font${alignr}${execibar 60 8,180 grok-quota percent}$color
${color #cdd6f4}Muse:$color${texeci 60 muse-quota fetch}${goto 130}${execpi 60 muse-quota color}${font monospace:size=11}${execi 60 muse-quota days}$font${alignr}${execibar 60 8,180 muse-quota percent}$color
${color #cdd6f4}MiMo:$color${texeci 60 mimo-quota fetch}${goto 130}${execpi 60 mimo-quota color}${font monospace:size=11}${execi 60 mimo-quota days}$font${alignr}${execibar 60 8,180 mimo-quota percent}$color

${color #89b4fa}${font sans-serif:size=14:bold}PROCESSES$font$color ${hr 2}
${color #cdd6f4}Name               PID   CPU%   MEM%
${color #bac2de}${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}
${color #bac2de}${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2}
${color #bac2de}${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3}
${color #bac2de}${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4}
]]
